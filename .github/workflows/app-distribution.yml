# Sends Android and iOS test builds to Firebase App Distribution.
#
#   merge to main      → Android only, Dev (mseller-dev-40a08) and Prod (mobile-seller-v3), in parallel → "testers"
#   Run workflow       → pick environment (or both), platform (or both) and groups
#
# iOS runs only from "Run workflow": each iOS build spends one of the Expo account's
# monthly EAS build credits, and two per merge to main exhausts the plan in a few days.
#
# Runs the same `pnpm distribute:*` scripts as a local upload, so both produce the same build.
# Android builds on this runner; iOS builds on EAS (ad hoc) and this runner uploads the IPA.
# Secrets: ENV_DEV / ENV_PROD (contents of .env.dev / .env.prod),
# FIREBASE_SERVICE_ACCOUNT_DEV / FIREBASE_SERVICE_ACCOUNT_PROD (JSON key, Firebase App Distribution Admin)
# and EXPO_TOKEN (iOS: starts the EAS build).

name: App Distribution

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      environment:
        description: Backend to build against
        type: choice
        options: [both, development, production]
        default: both
      platform:
        description: Platform to build
        type: choice
        options: [both, android, ios]
        default: both
      groups:
        description: Tester group aliases (comma-separated)
        type: string
        default: testers

permissions:
  contents: read

jobs:
  android:
    name: android (${{ matrix.app_env }})
    if: ${{ inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app_env: ${{ fromJSON((inputs.environment == 'development' && '["development"]') || (inputs.environment == 'production' && '["production"]') || '["development","production"]') }}
    concurrency:
      group: app-distribution-${{ github.ref }}-${{ matrix.app_env }}
      cancel-in-progress: true
    env:
      APP_ENV: ${{ matrix.app_env }}
      # Picks ENV_DEV / FIREBASE_SERVICE_ACCOUNT_DEV or the _PROD pair by name, so a
      # missing Prod secret fails the job instead of falling back to the Dev one.
      SECRET_SUFFIX: ${{ matrix.app_env == 'production' && 'PROD' || 'DEV' }}
      FIREBASE_TESTER_GROUPS: ${{ inputs.groups || 'testers' }}

    steps:
      - name: Checkout (full history — versionCode is the commit count)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools"; Google removed the legacy
          # "tools" package from the SDK repository, so sdkmanager exits 1 on it.
          packages: platform-tools

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write env file
        env:
          ENV_CONTENT: ${{ secrets[format('ENV_{0}', env.SECRET_SUFFIX)] }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::Secret ENV_$SECRET_SUFFIX is not set"
            exit 1
          fi
          file=$([ "$APP_ENV" = "production" ] && echo .env.prod || echo .env.dev)
          printf '%s\n' "$ENV_CONTENT" > "$file"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_{0}', env.SECRET_SUFFIX)] }}

      - name: Build and distribute
        run: |
          if [ "$APP_ENV" = "production" ]; then
            pnpm distribute:prod
          else
            pnpm distribute:dev
          fi

      - name: Summary
        if: success()
        run: |
          echo "### Sent MSeller Lite ($APP_ENV) to \`$FIREBASE_TESTER_GROUPS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\` · versionCode: $(git rev-list --count HEAD)" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: ios (${{ matrix.app_env }})
    # Manual only: see the note at the top about EAS build credits.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'android' }}
    # EAS does the macOS build; this runner only starts it, waits and uploads the IPA.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app_env: ${{ fromJSON((inputs.environment == 'development' && '["development"]') || (inputs.environment == 'production' && '["production"]') || '["development","production"]') }}
    concurrency:
      group: app-distribution-ios-${{ github.ref }}-${{ matrix.app_env }}
      cancel-in-progress: true
    env:
      APP_ENV: ${{ matrix.app_env }}
      SECRET_SUFFIX: ${{ matrix.app_env == 'production' && 'PROD' || 'DEV' }}
      FIREBASE_TESTER_GROUPS: ${{ inputs.groups || 'testers' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout (full history — release notes list recent commits)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS and Firebase CLIs
        run: npm install -g eas-cli firebase-tools

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN is not set"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('FIREBASE_SERVICE_ACCOUNT_{0}', env.SECRET_SUFFIX)] }}

      - name: Build on EAS and distribute
        run: |
          if [ "$APP_ENV" = "production" ]; then
            pnpm distribute:ios:prod
          else
            pnpm distribute:ios:dev
          fi
